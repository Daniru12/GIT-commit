name: Daily Commit

on:
  schedule:
    # Runs every day at 03:00 UTC (08:30 Sri Lanka time)
    - cron: "0 3 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - daily update" >> activity.log

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Daniru Ranathunga
          GIT_AUTHOR_EMAIL: punsithdaniru@gmail.com
          GIT_COMMITTER_NAME: Daniru Ranathunga
          GIT_COMMITTER_EMAIL: punsithdaniru@gmail.com
        run: |
          git add activity.log
          git commit -m "chore: daily update $(date -u '+%Y-%m-%d')"
          git push
